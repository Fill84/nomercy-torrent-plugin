name: build

# Builds and tests the NoMercy Torrent Downloader plugin, then packages a
# ready-to-drop plugin directory.
#
# The plugin is built against NoMercy.Plugins.Abstractions, which is NOT published
# to nuget.org. scripts/fetch-abstractions.sh clones the server and packs it (plus
# NoMercy.Events, which it depends on) into a local file feed that the committed
# nuget.config points at. The script is shared with local development on purpose,
# so CI and a developer's machine cannot drift.
#
# On a `v*` tag push, a Forgejo release is created and the packaged plugin zip is
# attached. Build, test and release run in a single job so we don't need the
# artifact upload/download API, which the act_runner routes through the internal
# `forgejo:3000` hostname that the per-workflow Docker network can't resolve.

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_DIR: NoMercy.Plugin.TorrentDownloader
  SERVER_BRANCH: dev
  DOTNET_CHANNEL: "10.0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Public Forgejo URL — used to clone this repo and hit the release API from
  # inside the workflow container, because the runner's default
  # GITHUB_SERVER_URL (http://forgejo:3000) isn't resolvable on the
  # per-workflow Docker network.
  PUBLIC_FORGEJO_URL: https://forgejo.phillippepelzer.me

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Runs on a host runner rather than in a container, so root is not a given and
      # the image may already carry these. Install only what is actually missing,
      # and only if we can - a runner that already has the tools should not fail
      # here just because apt-get needs a privilege we do not have.
      - name: Install base tooling
        run: |
          set -eu
          missing=""
          for tool in git curl zip unzip jq; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done

          if [ -z "$missing" ]; then
            echo "all required tools present"
            exit 0
          fi

          echo "missing:$missing"
          if [ "$(id -u)" = "0" ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "cannot install$missing - not root and no sudo available" >&2
            exit 1
          fi

          $SUDO apt-get update -y
          $SUDO apt-get install -y --no-install-recommends ca-certificates libicu-dev $missing

      - name: Install .NET SDK ${{ env.DOTNET_CHANNEL }}
        run: |
          set -eux
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --channel "$DOTNET_CHANNEL" --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --info

      # Manual checkout instead of actions/checkout@v4: the action clones from
      # $GITHUB_SERVER_URL, which the runner sets to an internal hostname the
      # workflow container can't resolve. The public URL works for both private
      # and public repos when the auto-generated GITHUB_TOKEN is passed via an
      # HTTP basic-auth header.
      - name: Checkout plugin (via public URL)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NO `set -x` IN THIS STEP. The auth header is the base64 of the token, and
          # the runner's secret masking only redacts the token's literal text - it
          # cannot recognise an encoded form of it. With xtrace on, the assignment
          # below is echoed verbatim and the token lands in the build log in full,
          # which for a public repo means a publicly readable credential.
          set -eu
          : "${TOKEN:?missing GITHUB_TOKEN}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          shopt -s dotglob nullglob
          rm -rf -- *
          git init -q .
          git remote add origin "${PUBLIC_FORGEJO_URL}/${GITHUB_REPOSITORY}.git"

          # Written to a file rather than passed with `git -c`: an argument is visible
          # in the process list to anything else running on the host, and would be
          # echoed by any later xtrace. Removed immediately afterwards.
          umask 077
          printf 'Authorization: basic %s\n' \
            "$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" > /tmp/gh-auth
          git config --local http.extraHeader "$(cat /tmp/gh-auth)"
          rm -f /tmp/gh-auth

          git fetch --depth=1 origin "$GITHUB_SHA"
          git config --local --unset-all http.extraHeader
          git checkout -q FETCH_HEAD
          git log --oneline -1

      # Packs NoMercy.Plugins.Abstractions and NoMercy.Events into ./_nupkgs,
      # which the committed nuget.config already lists as a package source.
      - name: Pack the plugin contract to a local feed
        id: contract
        # A developer keeps the server checkout beside this repo, which is the script's
        # default. CI has no siblings worth keeping, so it is pinned back inside the
        # workspace here - disposable with the rest of the run, and already gitignored.
        env:
          SERVER_DIR: _server
        run: |
          set -eu
          chmod +x scripts/fetch-abstractions.sh
          ./scripts/fetch-abstractions.sh

          # Recorded so a release names the exact contract it was built against. Building
          # a tag against a moving branch produces an artifact nobody can rebuild, and
          # "built against @dev" in release notes says nothing a year later.
          SERVER_SHA=$(git -C "$SERVER_DIR" rev-parse HEAD)
          echo "sha=$SERVER_SHA" >> "$GITHUB_OUTPUT"
          echo "contract: $SERVER_SHA"

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors belongs on the step that actually compiles. Passing it to
      # `dotnet test --no-build` did nothing whatsoever: that command compiles nothing,
      # and neither test project sets the property in its csproj, so a warning in test
      # code sailed straight through a step named "warnings as errors".
      - name: Build (Release, warnings as errors)
        run: dotnet build -c Release --no-restore -p:TreatWarningsAsErrors=true

      # A plugin that fails its own tests must not produce a release artifact.
      - name: Test (Release)
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

      - name: Stage the plugin directory
        id: stage
        run: |
          set -eux
          BIN="src/$PLUGIN_DIR/bin/Release/net10.0"
          STAGING="$PWD/_stage/$PLUGIN_DIR"
          mkdir -p "$STAGING"

          # The plugin assembly, its manifest, and the domain core it depends on.
          # deps.json travels with them so the load context resolves Core.
          cp "$BIN/$PLUGIN_DIR.dll"                              "$STAGING/"
          cp "$BIN/$PLUGIN_DIR.deps.json"                        "$STAGING/"
          cp "$BIN/NoMercy.Plugin.TorrentDownloader.Core.dll"    "$STAGING/"
          cp "src/$PLUGIN_DIR/plugin.json"                       "$STAGING/"
          # The plugin's own README, not the repository's. The repo README is for someone
          # building or contributing; what belongs beside an installed DLL is what the thing
          # does, what it declares and how it treats your credentials.
          cp "src/$PLUGIN_DIR/README.md"                         "$STAGING/"
          cp LICENSE                                             "$STAGING/"

          # Deliberately NOT shipped: NoMercy.Plugins.Abstractions.dll and
          # NoMercy.Events.dll. Both are the host's and live in its shared-assembly
          # set. Shipping a copy is how a plugin ends up with two incompatible
          # identities of the same type across the load-context boundary, and the
          # failure looks like an unrelated cast error far from its cause.
          #
          # Checked against $BIN, not $STAGING. Grepping the staging directory was
          # pointless: it holds exactly the six files copied above by name, so neither
          # assembly could ever appear there and the check could never fire. The
          # failure it is meant to catch - CopyLocalLockFileAssemblies=true - shows up
          # in the BUILD output, which is the thing worth looking at.
          if ls "$BIN" | grep -E '^NoMercy\.(Plugins\.Abstractions|Events)\.dll$'; then
            echo "a host-owned assembly was copied into the build output" >&2
            echo "see the PackageReference comment in the shell csproj" >&2
            exit 1
          fi

          # The staged list is an allowlist, so an assembly added in a later stage would be
          # named in deps.json, missing from the zip, and the plugin would fail to load with
          # a FileNotFoundException while CI went green. Check for that.
          #
          # Scoped to assemblies built from THIS repo, which deps.json distinguishes for us:
          # a project reference gets a bare filename key, a package gets a path key like
          # lib/net10.0/Foo.dll. Only the first group is ours to ship. The rest are either
          # host-provided (NoMercy.*, Microsoft.Extensions.*, Ulid - all present in the
          # server) or genuine third-party packages, and this step cannot tell those apart
          # without knowing the host's shared-assembly set. So it asserts what it can prove
          # and prints the rest for a human, rather than guessing and failing the build on a
          # dependency that was never ours to carry.
          # Without this, a missing jq makes the loop below iterate an empty list and the
          # check reports success having verified nothing - the same silently-passing guard
          # this step exists to replace.
          command -v jq >/dev/null 2>&1 || { echo "jq is required for the artifact checks" >&2; exit 1; }

          PROJECT_ASSEMBLIES=$(jq -r '.targets[] | to_entries[] | .value.runtime // {} | keys[]' \
                                "$STAGING/$PLUGIN_DIR.deps.json" | grep -v '/' | sort -u)
          if [ -z "$PROJECT_ASSEMBLIES" ]; then
            echo "deps.json listed no project-built assemblies - the query or the file shape changed" >&2
            exit 1
          fi

          MISSING=""
          for dep in $PROJECT_ASSEMBLIES; do
            [ -f "$STAGING/$dep" ] || MISSING="$MISSING $dep"
          done
          if [ -n "$MISSING" ]; then
            echo "deps.json names project-built assemblies missing from the artifact:$MISSING" >&2
            echo "add them to the staging list above, or the plugin will fail to load" >&2
            exit 1
          fi

          echo "package-sourced runtime assemblies, NOT shipped (host must provide these):"
          jq -r '.targets[] | to_entries[] | .value.runtime // {} | keys[]' \
            "$STAGING/$PLUGIN_DIR.deps.json" | grep '/' | sed 's|.*/||' | sort -u | sed 's/^/  /'

          REF="${GITHUB_REF_NAME:-}"
          case "$REF" in
            v*) VERSION="${REF#v}" ;;
            *)  VERSION="dev-${GITHUB_SHA:0:8}" ;;
          esac

          ZIP="$PLUGIN_DIR-$VERSION.zip"
          (cd "$PWD/_stage" && zip -r "../$ZIP" "$PLUGIN_DIR")
          ls -la "$ZIP"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP"         >> "$GITHUB_OUTPUT"

      - name: Create Forgejo release & attach asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRACT_SHA: ${{ steps.contract.outputs.sha }}
        run: |
          set -euo pipefail
          ZIP="${{ steps.stage.outputs.zip }}"
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          # Public API URL — same reason as the checkout step.
          API="${PUBLIC_FORGEJO_URL%/}/api/v1"

          BODY=$(cat <<EOF
          ## NoMercy Torrent Downloader — ${TAG}

          Keeps a TV library complete by downloading missing episodes over BitTorrent.

          > **This build loads but does not download.** The decision engine, the indexer
          > layer and the plugin shell are done. The download database, the torrent-client
          > clients and the loop that connects them are not. The settings page is
          > read-only until the REST surface lands, so there is nothing to configure yet.
          > Install it to check that it loads and reads your library, not to fetch episodes.

          ### Install
          1. Extract \`${ZIP}\` into \`<server>/plugins/\`.
          2. Restart the server.
          3. Enable the plugin in the dashboard and grant consent when prompted.

          It will register four scheduled jobs — \`transfers\`, \`feed\`, \`search\` and
          \`maintenance\` — visible individually in the server's job list.

          Requires NoMercy MediaServer with the plugin ABI 10.0 contract.

          Built and tested automatically against the plugin contract at
          \`NoMercy-Entertainment/nomercy-media-server@${CONTRACT_SHA}\`.

          To rebuild this exact artifact: \`SERVER_REF=${CONTRACT_SHA} ./scripts/fetch-abstractions.sh\`
          then \`dotnet build -c Release\`.
          EOF
          )

          # The token goes in a config file, not on the command line. A curl argument is
          # visible in the host's process list to anything else running on the runner,
          # which on a self-hosted box means any co-tenant process. That reasoning was
          # applied to the checkout step and missed here.
          umask 077
          CURL_CFG=$(mktemp)
          trap 'rm -f "$CURL_CFG"' EXIT
          printf 'header = "Authorization: token %s"\n' "$TOKEN" > "$CURL_CFG"

          echo "Creating release $TAG in $REPO"
          REL_JSON=$(curl -fsSL --config "$CURL_CFG" -X POST \
            -H "Content-Type: application/json" \
            "$API/repos/$REPO/releases" \
            -d "$(jq -n --arg tag "$TAG" --arg body "$BODY" \
                  '{tag_name:$tag, name:$tag, body:$body, draft:false, prerelease:false}')")

          REL_ID=$(echo "$REL_JSON" | jq -r '.id')
          if [ -z "$REL_ID" ] || [ "$REL_ID" = "null" ]; then
            echo "release creation returned no id - refusing to upload an asset" >&2
            exit 1
          fi
          echo "release id = $REL_ID"

          echo "Uploading asset $ZIP"
          curl -fsSL --config "$CURL_CFG" -X POST \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$ZIP" \
            "$API/repos/$REPO/releases/$REL_ID/assets?name=$(basename "$ZIP")"

          echo "Release published: $TAG"
